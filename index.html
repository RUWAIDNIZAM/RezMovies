<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sunset Project — Liquid Glass</title>

  <!-- Replace the font-face URL with Deezer's official webfont if you have it. -->
  <style>
    /* Using Inter (free Deezer-like font) */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
  </style>

  <style>
    /* Reset & base */
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#0b1020;font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;color:#e9eef8}

    /* Particle canvas sits full-screen */
    #particle-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}

    /* Centering container */
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;position:relative;z-index:2}

    /* Liquid glass card */
    .card{
      width:100%;max-width:880px;border-radius:22px;padding:28px;position:relative;overflow:hidden;
      background:linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
      box-shadow: 0 10px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      display:flex;flex-direction:column;gap:18px;align-items:flex-start
    }

    /* Soft glow circles for the liquid look */
    .card::before, .card::after{
      content:'';position:absolute;border-radius:50%;filter:blur(40px) opacity(.55);z-index:0;pointer-events:none}
    .card::before{width:360px;height:360px;right:-100px;top:-120px;background:linear-gradient(90deg,#ff9a9e,#fecfef)}
    .card::after{width:260px;height:260px;left:-80px;bottom:-100px;background:linear-gradient(90deg,#7f7fd5,#86a8e7)}

    /* Title styling (uses 'Inter' font name if present) */
    .title{position:relative;z-index:3;font-size:clamp(20px,5vw,42px);line-height:1.02;font-weight:800;letter-spacing:-0.5px;font-family:'Inter','Poppins',sans-serif;color:transparent;background:linear-gradient(90deg,#fff2c8,#ffd1c6,#ffd6ff);-webkit-background-clip:text;background-clip:text;text-shadow:0 2px 18px rgba(255,130,90,0.06)}

    /* Liquid sheen moving over title */
    .title-wrap{position:relative;overflow:hidden}
    .title::after{content:'';position:absolute;inset:0;background:linear-gradient(60deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.28) 45%, rgba(255,255,255,0.04) 60%);transform:translateX(-120%);animation:sheen 6s linear infinite}
    @keyframes sheen{to{transform:translateX(180%)}}

    /* Subtitle / message */
    .subtitle{font-size:clamp(12px,3vw,16px);z-index:3;color:rgba(233,238,248,0.92);opacity:0.95}
    .big-note{background:linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.04);width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}

    .status{font-weight:700;color:#ffd0a8}
    .muted{opacity:0.8;font-size:13px}

    /* Footer row */
    .meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:rgba(233,238,248,0.78)}

    /* Buttons */
    .btn{appearance:none;border:0;padding:10px 14px;border-radius:12px;font-weight:600;cursor:pointer}
    .btn.primary{background:linear-gradient(90deg,#ff8a65,#ffcc80);color:#0b1020}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:inherit}

    /* small decorative SVG waves at bottom */
    .glass-waves{position:absolute;left:0;right:0;bottom:-40px;z-index:1;opacity:0.28}

    /* Responsive tweaks */
    @media (max-width:520px){
      .card{padding:18px;border-radius:18px}
      .title{font-size:22px}
      .card::before{display:none}
    }

    /* Tiny heart pulse for 'made with love' */
    .love{display:inline-flex;gap:8px;align-items:center}
    .love .heart{width:14px;height:14px;display:inline-block;transform-origin:center;animation:pulse 1.6s infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.9}50%{transform:scale(1.28);opacity:1}100%{transform:scale(1);opacity:.9}}

  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <main class="wrap">
    <section class="card" role="region" aria-label="Sunset Project notice">
      <div style="z-index:3">
        <div class="title-wrap">
          <h1 class="title">Sunset Project</h1>
        </div>
        <p class="subtitle" style="margin-top:8px;max-width:70%">A small note from the team — beautiful endings, brief beginnings.</p>
      </div>

      <div class="big-note" style="z-index:3">
        <div style="flex:1">
          <div class="muted">Announcement:</div>
          <div style="margin-top:6px;font-size:15px;font-weight:700;color:#ffe8d1">"Rez Flix" got <span class="status">discontinued</span> on <strong>21/11/2025</strong></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
          <button class="btn primary" id="btn-share">Share</button>
          <button class="btn ghost" id="btn-close">Dismiss</button>
        </div>
      </div>

      <div class="meta" style="justify-content:center; align-items:center; text-align:center; z-index:3">
        
        <div style="margin:auto" class="love">made with <svg class="heart" viewBox="0 0 32 29" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="#ff6b81" d="M23.6 0c-2.7 0-5 1.6-6.6 3.9C14.4 1.6 12.1 0 9.4 0 4.2 0 0 4.3 0 9.6 0 17.4 16 29 16 29s16-11.6 16-19.4C32 4.3 27.8 0 23.6 0z"/></svg> by <strong style="margin-left:4px">ruwaidcool</strong></div>
      </div>

      <!-- decorative waves -->
      <svg class="glass-waves" viewBox="0 0 1200 120" preserveAspectRatio="none">
        <path d="M0,32 C150,90 350,0 600,32 C850,64 1050,10 1200,48 L1200,120 L0,120 Z" fill="rgba(255,255,255,0.03)"></path>
      </svg>
    </section>
  </main>

  <script>
    // Particle background — lightweight, responsive
    (function(){
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = innerWidth;
      let h = canvas.height = innerHeight;
      const DPR = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = innerWidth * DPR; canvas.height = innerHeight * DPR; canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px'; ctx.scale(DPR, DPR);

      const config = {count: Math.floor(Math.min(120, (w*h)/60000)), size: [1,3], speed: [0.1,0.6]};
      let particles = [];

      function rand(min,max){return Math.random()*(max-min)+min}
      function create(){
        for(let i=0;i<config.count;i++){
          particles.push({x:rand(0,w),y:rand(0,h),r:rand(config.size[0],config.size[1]),vx:rand(-config.speed[1],config.speed[1]),vy:rand(-config.speed[1],config.speed[1]),alpha:rand(0.08,0.35)})
        }
      }
      function resize(){
        w = canvas.width = innerWidth * DPR; h = canvas.height = innerHeight * DPR;
        canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px'; ctx.setTransform(1,0,0,1,0,0); ctx.scale(DPR,DPR);
        particles = []; create();
      }
      window.addEventListener('resize', throttle(resize,120));

      function draw(){
        ctx.clearRect(0,0,innerWidth,innerHeight);
        for(const p of particles){
          p.x += p.vx; p.y += p.vy;
          if(p.x < -10) p.x = innerWidth + 10; if(p.x > innerWidth + 10) p.x = -10;
          if(p.y < -10) p.y = innerHeight + 10; if(p.y > innerHeight + 10) p.y = -10;

          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, Math.max(8, p.r*10));
          g.addColorStop(0, `rgba(255,255,255,${p.alpha})`);
          g.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1,p.r*6), 0, Math.PI*2); ctx.fill();
        }
        requestAnimationFrame(draw);
      }

      function throttle(fn, wait){let t=0;return function(){const now=Date.now(); if(now-t>wait){t=now;fn()}}}

      create(); draw();
    })();

    // Buttons behaviour
    document.getElementById('btn-close').addEventListener('click', function(){
      document.querySelector('.card').style.transform = 'translateY(30px) scale(.98)';
      document.querySelector('.card').style.opacity = '0';
      setTimeout(()=>document.querySelector('.card').remove(),480);
    });
    document.getElementById('btn-share').addEventListener('click', function(){
      const txt = 'Rez Flix discontinued on 21/11/2025 — Sunset Project by RuwaidCool';
      if(navigator.share){navigator.share({title:'Sunset Project',text:txt}).catch(()=>copyToClipboard(txt))}else{copyToClipboard(txt)}
    });

    function copyToClipboard(text){
      try{navigator.clipboard.writeText(text); alert('Copied share text to clipboard')}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('Copied share text to clipboard')}
    }

    // Easter Egg — robust version
    (function(){
      // defensive: run after DOM ready
      function ready(fn){ if(document.readyState!='loading')fn();else document.addEventListener('DOMContentLoaded',fn); }
      ready(function(){
        const eggTarget = document.querySelector('.love strong');
        if(!eggTarget){ console.warn('Easter egg target not found'); return; }

        // tiny flash to show handler active (will disappear)
        eggTarget.animate([{ opacity: 0.6 }, { opacity: 1 }], { duration: 420 });

        let taps = 0, resetTimer = null;
        const resetDelay = 900; // ms — more forgiving on mobile

        function registerTap(){
          taps++;
          clearTimeout(resetTimer);
          resetTimer = setTimeout(()=> taps = 0, resetDelay);
          // debug: briefly show count as tooltip-like title
          eggTarget.setAttribute('data-taps', taps);
          if(taps >= 5){
            taps = 0; clearTimeout(resetTimer);
            setTimeout(()=> eggTarget.removeAttribute('data-taps'), 400);
            const pin = prompt('Enter Security PIN');
            if(pin === '2007'){
              alert('Access Granted');
            } else {
              alert('Wrong PIN');
            }
          }
        }

        // support click, touchstart and pointerdown to be robust on all devices
        eggTarget.addEventListener('click', registerTap);
        eggTarget.addEventListener('touchstart', function(e){ e.preventDefault(); registerTap(); });
        eggTarget.addEventListener('pointerdown', function(){ registerTap(); });

        // accessibility: keyboard activation
        eggTarget.tabIndex = 0;
        eggTarget.addEventListener('keydown', function(e){ if(e.key==='Enter' || e.key===' ') { e.preventDefault(); registerTap(); } });

        // small visual hint if user opens devtools: console.log
        console.log('Easter-egg handler attached to', eggTarget);
      });
    })();
  </script>
